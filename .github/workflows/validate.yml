name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/requirements.txt
      - run: python .github/scripts/validate.py
      - run: python -m unittest discover -s .github/tests
      - run: python .github/scripts/build.py
      - run: node --check website/src/app.js
